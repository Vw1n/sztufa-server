name: 备份内存限制独立压测

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  memory-benchmark:
    name: 运行 60MB/120MB 备份有界内存压测
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js (22.x)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 安装锁定依赖
        run: npm ci

      - name: 运行备份内存压测
        run: npm run test:backup-memory
